<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natter</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Caveat:wght@600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <video id="video" playsinline muted></video>
    <canvas id="under"></canvas>
    <div id="bubbles"></div>
    <canvas id="overlay"></canvas>
    <div id="modes"></div>
    <div id="rail">
      <button id="delete-mode" type="button" aria-pressed="false">🔥 Delete</button>
      <button id="draw-zones" type="button" aria-pressed="false">Draw zones</button>
      <button id="tidy" type="button">✨ Tidy</button>
      <button id="undo" type="button">↶ Undo</button>
    </div>
    <div id="stage"><span class="what"></span><span class="heard"></span></div>
    <div id="health"><i></i><span></span></div>
    <div id="mics"></div>
    <div id="feed" hidden></div>
    <pre id="readout"></pre>
    <div id="keys" hidden></div>
    <div id="keys-tip"><kbd>?</kbd> keys</div>
    <div id="hint"></div>
    <div id="msg"></div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
